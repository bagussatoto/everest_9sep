<!DOCTYPE html>
<html>
<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{title}</title>

    <style>
        html {
            zoom: 100%;
        }
        * {
            box-sizing: border-box;
            -moz-box-sizing: border-box;
        }

        .pageHeader {
            position: fixed;
            top: 0mm;
        }

        .pageBody {
        }

        .pageFooter {
            position: fixed;
            bottom: 0mm;
        }

        @page {
            size: A4 potrait;
            margin: 3mm;
        }

        @media print {
            html, body {
            }
        }
        @media screen {
            a[href]:after {
                display: none;
                visibility: hidden;
            }
            td{
                width: max-content;
            }
        }
        @media print {
            a[href]:after {
                display: none;
                visibility: hidden;
            }
            .text-white {
                display: none;
                visibility: hidden;
            }
            .hidden-on-print {
                display: none !important;
            }
        }
        .img-thumbnail{
            border: none !important;
        }
        .text-renggang-5{
            letter-spacing: 5px;
        }
    </style>

    <script src="{cdn_suport}AdminLTE-2.3.11/plugins/jQuery/jquery-2.2.3.min.js?v={local_version}"></script>
    <script src="{cdn_suport}bootstrap-3.3.7-dist/js/bootstrap.min.js?v={local_version}"></script>
    <script src="{cdn_suport}sweetalert2-master/dist/sweetalert2.min.js?v={local_version}"></script>
    <script src="{cdn_suport}bootstrap3-dialog-master/dist/js/bootstrap-dialog.min.js?v={local_version}"></script>
    <script src="{cdn_suport}AdminLTE-2.3.11/plugins/slimScroll/jquery.slimscroll.min.js?v={local_version}"></script>
    <script src="{cdn_suport}AdminLTE-2.3.11/dist/js/app.min.js?v={local_version}"></script>
    <script src="{cdn_suport}multi-step-modal-master/multi-step-modal.js?v={local_version}"></script>
    <script src="{cdn_suport}bootstrap-fileinput-master/js/fileinput.min.js?v={local_version}"></script>
    <script src="{cdn_suport}bootstrap-toggle-master/js/bootstrap-toggle.min.js?v={local_version}"></script>
    <script src="{base}assets/custom/hippo_ajax.js?v={local_version}"></script>
    <link rel="stylesheet" href="{base}assets/custom/custom.min.css?v={local_version}">
    <link rel="stylesheet" href="{cdn_suport}bootstrap-3.3.7-dist/css/bootstrap.min.css?v={local_version}">

</head>

<body class="hold-transition skin-blue sidebar-mini" onload="" style="">

{option}

<div class="row" style="padding-left: 15px; padding-right: 15px; margin-top: 10px;">
    <div class="col-md-12">
        <!-- Judul Dokumen (Huruf Renggang) dan Nomor Transaksi di Kiri, Tanggal Sejajar di Kanan -->
        <div style="overflow: hidden; margin-bottom: 8px;">
            {tanggal_transaksi}
        </div>

        <!-- Kop: Logo & Profil Perusahaan (Kiri) dan Informasi Setoran (Kanan) Sejajar Presisi dengan Tabel -->
        <div class="row" style="margin-left: 0; margin-right: 0; margin-bottom: 15px;">
            <div id="cprofile" class="col-xs-6 text-left" style="padding-left: 0; padding-right: 10px;">
                <div id="logo" class="text-left no-padding" style="margin-top: 2px; margin-right: 12px; height: 90px; width: 95px; float: left;">
                    {logo_header_print_00}
                </div>
                {companyProfile}
            </div>
            <div class="col-xs-6 text-left" style="padding-left: 10px; padding-right: 0;">
                <div class="panel panel-default" style="margin-bottom: 0;">
                    {fixedElements}
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row" style="padding-left: 15px; padding-right: 15px;">
    <div class="col-md-12">
        <div class="panel panel-default">
            {content}
        </div>
    </div>
</div>

<div class="" style="width: 100%; float: left; position: relative; min-height: 1px; padding-right: 15px; padding-left: 15px;">
    <div style="width: 45%; float: left; position: relative; min-height: 1px; padding-right: 10px; padding-left: 0px;">
        <div class="panel panel-default" style="min-height: 135px;">
            {noteDetails}
        </div>
    </div>
    <div class="" style="width: 55%; float: left; position: relative; min-height: 1px; padding-right: 0px; padding-left: 5px;">
        <!--<div class="panel panel-default text-center">-->
        {sign_2}
        <!--</div>-->
    </div>
</div>

</body>
</html>
